[project]
name = "cold-chain-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "pydantic-settings", "psycopg[binary]", "redis", "boto3", "sqlalchemy", "alembic", "authlib", "itsdangerous", "httpx", "python-multipart", "rq", "reportlab"]
[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "mypy", "boto3-stubs[s3]"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
