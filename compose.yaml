name: cold-chain-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coldchain
      POSTGRES_DB: coldchain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldchain -d coldchain"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
  storage:
    build: infra/storage
  storage-init:
    build: services/api
    depends_on: [storage]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    command: ["python", "-c", "import boto3,time; time.sleep(3); boto3.client('s3',endpoint_url='http://storage:9000').create_bucket(Bucket='evidence')"]
    restart: on-failure:5
  identity:
    image: quay.io/keycloak/keycloak:26.4.7
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./infra/keycloak:/opt/keycloak/data/import:ro"]
  api:
    build: services/api
    environment:
      CC_DATABASE_URL: postgresql://coldchain:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/coldchain
      CC_REDIS_URL: redis://redis:6379/0
      CC_S3_ENDPOINT: http://storage:9000
      CC_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      CC_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      CC_S3_BUCKET: evidence
      CC_OIDC_ISSUER: http://localhost:8080/realms/coldchain
      CC_OIDC_BACKCHANNEL: http://identity:8080/realms/coldchain
      CC_OIDC_CLIENT_ID: coldchain
      CC_SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      CC_SECURE_COOKIES: "false"
      CC_SYNTHETIC_ONLY: "true"
    command: ["sh", "-c", "alembic upgrade head && python -m app.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      retries: 12
  web:
    build: apps/web
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres-data:
