name: CI
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r services/api/requirements-dev.lock
      - run: ruff check --config services/api/pyproject.toml services/api
      - run: ruff format --check --config services/api/pyproject.toml services/api
      - run: mypy --config-file services/api/pyproject.toml services/api/app
      - run: pytest services/api/tests
      - run: python scripts/export_openapi.py --check
  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: curl --fail http://localhost:8000/api/v1/health/ready && curl --fail http://localhost:3000
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8080/realms/coldchain/.well-known/openid-configuration
      - run: npm run test:e2e
      - name: Disposable PostgreSQL and object restore drill
        run: |
          docker compose exec -T postgres pg_dump -U coldchain -d coldchain --no-owner --no-privileges > /tmp/coldchain-backup.sql
          docker compose exec -T postgres createdb -U coldchain cc_restore
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U coldchain -d cc_restore < /tmp/coldchain-backup.sql
          query="SELECT md5(string_agg(snapshot_sha256, ',' ORDER BY id)) FROM decisions"
          original=$(docker compose exec -T postgres psql -U coldchain -d coldchain -tAc "$query")
          restored=$(docker compose exec -T postgres psql -U coldchain -d cc_restore -tAc "$query")
          test -n "$original"
          test "$original" = "$restored"
          docker compose exec -T -e CC_RECOVERY_DATABASE=cc_restore api python -m app.recovery
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-traces, path: test-results/}
      - if: always()
        run: docker compose logs --tail 150 && docker compose down

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: test, POSTGRES_PASSWORD: synthetic-test-only, POSTGRES_DB: test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test" --health-interval 5s --health-retries 20
    env:
      CC_TEST_POSTGRES_URL: postgresql://test:synthetic-test-only@localhost:5432/test
      CC_BENCHMARK_OUTPUT: benchmark-postgres.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r services/api/requirements-dev.lock
      - run: pytest services/api/tests -q
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: postgres-benchmark, path: benchmark-postgres.json}
