name: CI
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r services/api/requirements-dev.lock
      - run: ruff check --config services/api/pyproject.toml services/api
      - run: ruff format --check --config services/api/pyproject.toml services/api
      - run: mypy --config-file services/api/pyproject.toml services/api/app
      - run: pytest services/api/tests
      - run: python scripts/export_openapi.py --check
  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: curl --fail http://localhost:8000/api/v1/health/ready && curl --fail http://localhost:3000
      - if: always()
        run: docker compose logs --tail 50 && docker compose down
